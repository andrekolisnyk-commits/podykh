<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root {
  --bg: #f1f2f0;
  --ink: #17202a;
  --ink2: rgba(23, 32, 42, .70);
  --ink3: rgba(23, 32, 42, .48);
  --line: rgba(23, 32, 42, .13);
  --cold: #2f6fc4;
  --warm: #b4531f;
  --panel: #f8f9f7;
  --scrim: rgba(15, 25, 38, .38);
  --serif: 'Spectral', 'Georgia', 'Times New Roman', serif;
  --sans: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419; --ink: #eef1f3; --ink2: rgba(238, 241, 243, .72); --ink3: rgba(238, 241, 243, .48);
    --line: rgba(238, 241, 243, .14); --cold: #6aa8f0; --warm: #e8935a; --panel: #172029; --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419; --ink: #eef1f3; --ink2: rgba(238, 241, 243, .72); --ink3: rgba(238, 241, 243, .48);
  --line: rgba(238, 241, 243, .14); --cold: #6aa8f0; --warm: #e8935a; --panel: #172029; --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

:root[data-sky="sun"] { --bg: #d9e8f8; }
:root[data-sky="cloud"] { --bg: #e1e6eb; }
:root[data-sky="rain"] { --bg: #cbd7e5; }
:root[data-sky="night"] { --bg: #d5ddea; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-sky="sun"] { --bg: #0e1a28; }
  :root:not([data-theme="light"])[data-sky="cloud"] { --bg: #151b22; }
  :root:not([data-theme="light"])[data-sky="rain"] { --bg: #0f1a27; }
  :root:not([data-theme="light"])[data-sky="night"] { --bg: #0c111d; }
}
:root[data-theme="dark"][data-sky="sun"] { --bg: #0e1a28; }
:root[data-theme="dark"][data-sky="cloud"] { --bg: #151b22; }
:root[data-theme="dark"][data-sky="rain"] { --bg: #0f1a27; }
:root[data-theme="dark"][data-sky="night"] { --bg: #0c111d; }
body { transition: background-color .5s; }
.bic svg { display: block; width: 64px; height: 64px; overflow: visible; }
.bic { margin-top: 14px; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; min-height: 100%; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 44px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.place { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; padding: 6px 0; font-size: 16px; font-weight: 500; cursor: pointer; min-width: 0; }
.place svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; }
.place span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { font-size: 12.5px; color: var(--ink3); text-align: right; }

.hero { margin-top: 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.hl { min-width: 0; }
.temp { position: relative; width: max-content; font-size: clamp(88px, 25vw, 124px); font-weight: 200; line-height: .92; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.temp sup { position: absolute; left: 100%; top: .05em; margin-left: 2px; font-size: .4em; font-weight: 300; letter-spacing: 0; }
.cond { margin: 8px 0 0; font-size: 19px; }
.feels { margin: 3px 0 0; font-size: 15px; color: var(--ink2); }
.map { flex: 0 1 44%; max-width: 250px; min-width: 120px; margin-top: 4px; }
.map svg { display: block; width: 100%; height: auto; overflow: visible; }
.map svg text { font-family: var(--sans); pointer-events: none; }
.mo { fill: var(--ink); stroke: var(--ink); stroke-linejoin: round; }
.mi { fill: var(--bg); stroke: var(--bg); stroke-linejoin: round; }
.pin { fill: var(--ink); }
.ring { fill: none; stroke: var(--ink); transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ring { animation: none; opacity: .35; } }

.verdict { margin: 26px 0 0; max-width: 24em; font-family: var(--serif); font-weight: 300; font-size: clamp(27px, 7vw, 34px); line-height: 1.22; letter-spacing: -.01em; text-wrap: balance; }

.sec { margin: 34px 0 0; font-size: 12px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--ink3); }

.lines { margin: 22px 0 0; border-top: 1px solid var(--line); }
.lines p { margin: 0; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 18px; line-height: 1.4; }

.note { margin: 26px 0 0; font-size: 13px; line-height: 1.5; color: var(--ink3); }
.note b { font-weight: 500; color: var(--ink2); }

.hours { display: flex; gap: 0; overflow-x: auto; margin: 10px -20px 0; padding-inline: 20px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.hours::-webkit-scrollbar { display: none; }
.hr { flex: none; width: 62px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 4px; font-variant-numeric: tabular-nums; }
.hr.nd { border-left: 1px solid var(--line); }
.hr .dv { height: 14px; font-size: 11.5px; line-height: 14px; color: var(--ink3); font-weight: 500; }
.hr .tm { font-size: 14px; color: var(--ink2); }
.hr .tt { font-size: 18px; font-weight: 500; }
.hr .tt.fr { color: var(--cold); }
.hr .mm { height: 14px; font-size: 12.5px; font-weight: 500; line-height: 14px; color: #3f93f0; }
.ic svg { display: block; width: 34px; height: 34px; overflow: visible; }
.pp { display: block; margin-top: 1px; text-align: center; font-size: 12.5px; font-weight: 500; color: #3f93f0; line-height: 14px; font-variant-numeric: tabular-nums; }
.ic { text-align: center; }

.days { margin-top: 10px; border-top: 1px solid var(--line); }
.day { cursor: pointer; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 10px; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.day .nm { min-width: 0; }
.chev { width: 8px; height: 8px; border-right: 1.6px solid var(--ink3); border-bottom: 1.6px solid var(--ink3); transform: rotate(45deg); margin-top: -4px; transition: transform .2s; }
.day[aria-expanded="true"] .chev { transform: rotate(-135deg); margin-top: 4px; }
.day[aria-expanded="true"] { border-bottom-color: transparent; }
.dd { padding: 0 0 16px; border-bottom: 1px solid var(--line); }
.dd .dh { margin-top: 12px; }
.dd p { margin: 8px 0 0; font-size: 16px; line-height: 1.45; color: var(--ink); }
.day:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.hint2 { margin: 6px 0 0; font-size: 13px; color: var(--ink3); }
.day .nm b { display: block; font-size: 18px; font-weight: 500; }
.day .nm span { display: block; margin-top: 2px; font-size: 15px; color: var(--ink2); }
.day .nm em { display: block; margin-top: 2px; font-size: 14.5px; font-style: normal; color: var(--cold); }
.day .tp { text-align: right; font-variant-numeric: tabular-nums; line-height: 1.35; }
.day .tp span { display: block; font-size: 14px; color: var(--ink2); }
.day .tp b { font-size: 19px; font-weight: 500; color: var(--ink); }
.day .tp span + span b { font-weight: 400; color: var(--ink2); font-size: 17px; }

.src { margin: 30px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--ink3); }

.scrim { position: fixed; inset: 0; z-index: 10; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.scrim[hidden] { display: none; }
.sheet { width: min(560px, 100%); max-height: 86%; overflow: auto; background: var(--panel); border-radius: 22px 22px 0 0; padding: 18px 20px calc(env(safe-area-inset-bottom, 0px) + 22px); }
.sheet h2 { margin: 0 0 14px; font-size: 17px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
.sheet h3 { margin: 22px 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--ink3); }
.sheet .x { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink2); padding: 4px 8px; }
.row { display: flex; gap: 8px; }
.btn { background: var(--ink); color: var(--bg); border: 0; border-radius: 12px; padding: 12px 16px; font-size: 16px; font-weight: 500; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.sheet input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.list { margin: 6px 0 0; padding: 0; list-style: none; }
.list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); }
.list li button.pick { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 12px 0; font-size: 16px; cursor: pointer; }
.list li small { display: block; color: var(--ink3); font-size: 12.5px; }
.list li button.del { background: none; border: 0; color: var(--ink3); cursor: pointer; font-size: 18px; padding: 6px 8px; }
.msg { margin: 8px 0 0; font-size: 14px; color: var(--ink2); }

@media (min-width: 720px) { .wrap { padding-block: 32px 60px; } }
@media (max-width: 380px) { .day { gap: 10px; } }
</style>

</head>
<body>
<main class="wrap">
  <header class="top">
    <button class="place" id="placeBtn" aria-haspopup="dialog">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.5s4.5-4.2 4.5-7.8A4.5 4.5 0 0 0 3.5 6.7C3.5 10.3 8 14.5 8 14.5z"/><circle cx="8" cy="6.7" r="1.6"/></svg>
      <span id="placeName">Завантажую</span>
    </button>
    <span class="status" id="status"></span>
  </header>

  <section class="hero" aria-live="polite">
    <div class="hl">
      <div class="temp"><span id="t">0</span><sup>°</sup></div>
      <div class="bic" id="bic"></div>
      <p class="cond" id="cond"></p>
      <p class="feels" id="feels"></p>
    </div>
    <div class="map" id="mapSec"><svg id="map" role="img" aria-label="Контур Поділля"></svg></div>
  </section>

  <p class="verdict" id="verdict"></p>

  <div class="lines" id="lines"></div>

  <h2 class="sec">Найближчі години</h2>
  <section class="hours" id="hours" aria-label="Погода по годинах"></section>

  <h2 class="sec">Наступні дні</h2>
  <p class="hint2">Торкніться дня, щоб побачити його по годинах.</p>
  <section class="days" id="days" aria-label="Прогноз по днях"></section>

  <p class="note" id="hz"></p>

  <p class="src" id="src"></p>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <h2><span id="shTitle">Місце</span><button class="x" id="shClose" aria-label="Закрити">×</button></h2>
    <button class="btn" id="gpsBtn">Використати моє місцезнаходження</button>
    <p class="msg" id="gpsMsg" hidden></p>
    <h3>Особисте посилання</h3>
    <div class="row"><input type="text" id="lk" placeholder="Вставте посилання, яке вам надіслали" autocomplete="off" autocapitalize="off" aria-label="Особисте посилання"><button class="btn ghost" id="lkBtn">Готово</button></div>
    <p class="msg" id="lkMsg" hidden></p>
    <h3>Пошук за назвою</h3>
    <div class="row"><input type="text" id="q" placeholder="Село, місто, район" autocomplete="off" aria-label="Пошук місця"></div>
    <ul class="list" id="results"></ul>
    <p class="msg" id="qMsg" hidden></p>
    <h3>Збережені місця</h3>
    <ul class="list" id="saved"></ul>
    <h3>Зберегти поточне місце</h3>
    <div class="row"><input type="text" id="saveName" placeholder="Назва, наприклад Хата" autocomplete="off" aria-label="Назва місця"><button class="btn ghost" id="saveBtn">Зберегти</button></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var MINUS = '−';
  var WDS = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  var WDL = ['неділя', 'понеділок', 'вівторок', 'середа', 'четвер', 'п’ятниця', 'субота'];
  var WDA = ['у неділю', 'у понеділок', 'у вівторок', 'у середу', 'у четвер', 'у п’ятницю', 'у суботу'];
  var FROM = ['з півночі', 'з північного сходу', 'зі сходу', 'з південного сходу', 'з півдня', 'з південного заходу', 'із заходу', 'з північного заходу'];

  function num(n, d) { var r = +n.toFixed(d); return (r < 0 ? MINUS : '') + Math.abs(r).toFixed(d).replace('.', ','); }
  function deg(n) { return num(n, 0) + '°'; }
  function deg1(n) { return num(n, 1) + '°'; }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }

  /* ---------- storage (light, per viewer) ---------- */
  function lsGet(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  /* The home place is never stored in this file: it arrives through a private link (#p=lat,lon,name) and is kept on the phone. The hash stays in the address bar on purpose, so a home-screen icon made from that page opens with the place already set. */
  function parseLink(str) {
    var m = /#p=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?),([^\s#]{1,200})/.exec(str || '');
    if (!m) return null;
    var la = +m[1], lo = +m[2], nm = '';
    try { nm = decodeURIComponent(m[3]); } catch (e) { nm = m[3]; }
    return la >= -90 && la <= 90 && lo >= -180 && lo <= 180 ? { name: nm, lat: la, lon: lo } : null;
  }
  (function () { var p = parseLink(location.hash); if (p) lsSet('podykh-active', p); })();
  /* iPhone: a home-screen icon is a separate app with its own storage, and it opens the manifest's start_url, not the page you were on.
     So on iOS the manifest is rebuilt on the fly with the place inside start_url; the icon then carries the place with it. */
  function iosManifest() {
    if (!/iPhone|iPad|iPod/.test(navigator.userAgent)) return;
    var p = lsGet('podykh-active', null); if (!p) return;
    var base = location.origin + location.pathname.replace(/[^\/]*$/, '');
    var start = base + '#p=' + p.lat + ',' + p.lon + ',' + encodeURIComponent(p.name);
    var mf = { name: 'Подих', short_name: 'Подих', lang: 'uk', id: base, start_url: start, scope: base, display: 'standalone', background_color: '#dce9f7', theme_color: '#dce9f7',
      icons: [{ src: base + 'icons/icon-192.png', sizes: '192x192', type: 'image/png' }, { src: base + 'icons/icon-512.png', sizes: '512x512', type: 'image/png' }] };
    var l = document.querySelector('link[rel="manifest"]'); if (!l) return;
    l.setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(mf)));
  }
  iosManifest();
  window.addEventListener('hashchange', function () { if (/^#p=/.test(location.hash)) location.reload(); });
  var places = lsGet('podykh-places', []);
  var place = lsGet('podykh-active', null);
  var M = null;

  /* ---------- data model ---------- */
  function build(o) {
    var n = o.time.length, dayOf = [], hour = [], dates = [], di = -1, last = '';
    for (var i = 0; i < n; i++) {
      var ds = o.time[i].slice(0, 10);
      if (ds !== last) { di++; last = ds; dates.push(ds); }
      dayOf.push(di); hour.push(parseInt(o.time[i].slice(11, 13), 10));
    }
    var days = dates.map(function (ds, k) {
      var p = ds.split('-');
      return { date: ds, wd: new Date(+p[0], +p[1] - 1, +p[2]).getDay(), start: dayOf.indexOf(k), end: dayOf.lastIndexOf(k) };
    });
    return Object.assign({ n: n, dayOf: dayOf, hour: hour, days: days }, o);
  }
  /* Two models: ICON (DWD) as the base, ECMWF as the second opinion on rain.
     Keys come suffixed per model; an older cached answer without suffixes still works. */
  var MODELS = ['icon_seamless', 'ecmwf_ifs025'];
  function fromApi(j) {
    var h = j.hourly, n = h.time.length;
    function arr(a, fb) { if (!a) return new Array(n).fill(0); return a.map(function (v, i) { return v == null ? (fb ? fb[i] : 0) : v; }); }
    function pick(name, fb) {
      var A = h[name + '_' + MODELS[0]], B = h[name + '_' + MODELS[1]], U = h[name];
      if (!A && !B) return arr(U, fb);
      return arr((A || B).map(function (v, i) { return v == null ? (B && B[i] != null ? B[i] : null) : v; }), fb);
    }
    function each(name) { var out = MODELS.map(function (m) { return h[name + '_' + m]; }).filter(Boolean); return out.length ? out : [h[name] || []]; }
    var T = pick('temperature_2m'), cur = j.current || {};
    var Ps = each('precipitation'), PPs = each('precipitation_probability'), WCs = each('weather_code');
    var P = [], PX = [], PP = [], WC = [], RAINY = [];
    for (var i = 0; i < n; i++) {
      var sum = 0, cnt = 0, mx = 0, pp = 0, wc = 0, rainy = false;
      Ps.forEach(function (x) { if (x[i] != null) { sum += x[i]; cnt++; mx = Math.max(mx, x[i]); } });
      PPs.forEach(function (x) { if (x[i] != null) pp = Math.max(pp, x[i]); });
      WCs.forEach(function (x) { var c = x[i]; if (c != null) { if (c > wc) wc = c; if ((c >= 51 && c <= 67) || (c >= 71 && c <= 86) || c >= 95) rainy = true; } });
      P.push(cnt ? sum / cnt : 0); PX.push(mx); PP.push(pp); WC.push(wc); RAINY.push(rainy);
    }
    var nowIdx = 0;
    if (cur.time) { var key = cur.time.slice(0, 13); for (i = 0; i < n; i++) { if (h.time[i].slice(0, 13) === key) { nowIdx = i; break; } } }
    var A = pick('apparent_temperature', T);
    return build({
      time: h.time, T: T, A: A, P: P, PX: PX, PP: PP, WC: WC, RAINY: RAINY,
      C: pick('cloud_cover'), W: pick('wind_speed_10m'), G: pick('wind_gusts_10m', pick('wind_speed_10m')), DIR: pick('wind_direction_10m'),
      S: pick('soil_temperature_0cm', T), D: pick('is_day'), nowIdx: nowIdx,
      curT: cur.temperature_2m != null ? cur.temperature_2m : T[nowIdx], curA: cur.apparent_temperature != null ? cur.apparent_temperature : A[nowIdx],
      stamp: cur.time ? cur.time.slice(11, 16) : ''
    });
  }
  /* an hour counts as wet if either model puts at least 0.1 mm there, or calls it rain/drizzle/snow itself */
  function wet(i) { return M.PX[i] >= 0.1 || M.RAINY[i]; }
  function drizzle(i) { return M.PX[i] < 0.3; }
  function demo() {
    var now = new Date(), time = [], T = [], A = [], P = [], PP = [], C = [], W = [], G = [], DIR = [], S = [], D = [];
    var mean = [5, 3.8, 7, 8.5, 6, 4.5, 7], amp = [5.5, 5, 3.5, 4.5, 6, 5.5, 4], cl = [0.2, 0.1, 0.95, 0.5, 0.55, 0.2, 0.6];
    var rain1 = { 14: 0.2, 15: 0.8, 16: 1.3, 17: 1.1, 18: 0.5, 19: 0.2 }, rain4 = { 18: 0.2, 19: 0.4, 20: 0.2 };
    for (var i = 0; i < 168; i++) {
      var d = Math.floor(i / 24), hd = i % 24, dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d, hd);
      time.push(dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()) + 'T' + pad(hd) + ':00');
      var t = mean[d] + amp[d] * Math.cos((hd - 16.5) / 24 * 2 * Math.PI) + 0.3 * Math.sin(i * 1.7);
      var c = clamp(cl[d] + 0.12 * Math.sin(i * 0.5) + (d === 0 && hd > 14 ? 0.15 : 0), 0, 1);

    $('verdict').textContent = cp.verdict;
    $('lines').hidden = !cp.lines.length;
    $('lines').innerHTML = cp.lines.map(function (t) { return '<p>' + t + '</p>'; }).join('');
    var sk = sky(M.nowIdx); $('bic').innerHTML = ico(sk.k);
    document.documentElement.setAttribute('data-sky', sk.k === 'sun' || sk.k === 'partly' ? 'sun' : sk.k === 'moon' || sk.k === 'partlyN' ? 'night' : sk.k === 'cloud' ? 'cloud' : 'rain');
    renderHazards(); renderHours(); renderDays(); renderMap();
    var st = M.demo ? 'Демо-дані' : source === 'cache' ? 'Збережено о ' + M.stamp + ', без зв’язку' : 'Оновлено о ' + M.stamp;
    $('status').textContent = st;
    var rules = ' Небезпечні явища позначаємо за власними порогами (пориви від 15 м/с, злива від 5 мм за годину, сильні опади від 20 мм за добу, мороз від −15°, спека від 30°). Це не офіційне попередження: його дають ДСНС та Укргідрометцентр.';
    $('src').textContent = (M.demo
      ? 'Це макет на демо-даних: у цьому перегляді немає доступу до мережі. У встановленій апці прогноз бере Open-Meteo.com (CC BY 4.0).'
      : 'Дані: Open-Meteo.com (CC BY 4.0), моделі ICON (DWD) і ECMWF. Якщо хоч одна бачить дощ, апка не скаже «сухо».') + ' Оцінка приморозку: ясне небо, слабкий вітер і температура ґрунту, це не гарантія.' + rules;
    document.title = 'Подих';
  }

  var HOURLY = 'temperature_2m,apparent_temperature,precipitation,precipitation_probability,cloud_cover,wind_speed_10m,wind_gusts_10m,wind_direction_10m,soil_temperature_0cm,is_day,weather_code';
  function fetchJson(url, ms) {
    var ctl = new AbortController(), tm = setTimeout(function () { ctl.abort(); }, ms);
    return fetch(url, { signal: ctl.signal }).then(function (r) { clearTimeout(tm); if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
  }
  function load() {
    var key = 'podykh-cache-' + place.lat.toFixed(2) + ',' + place.lon.toFixed(2);
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + place.lat + '&longitude=' + place.lon +
      '&hourly=' + HOURLY + '&current=temperature_2m,apparent_temperature&timezone=auto&forecast_days=7&wind_speed_unit=ms&models=' + MODELS.join(',');
    $('status').textContent = 'Оновлюю';
    return fetchJson(url, 8000).then(function (j) {
      M = fromApi(j); lsSet(key, j); render('live');
    }).catch(function () {
      var cached = lsGet(key, null);
      if (cached) { try { M = fromApi(cached); render('cache'); return; } catch (e) {} }
      M = demo(); render('demo');
    });
  }
  function setPlace(p, persist) {
    place = p; if (persist !== false) lsSet('podykh-active', p);
    closeSheet(); load();
  }

  /* ---------- place sheet ---------- */
  function openSheet() { $('scrim').hidden = false; renderSaved(); $('q').focus(); }
  function closeSheet() { $('scrim').hidden = true; }
  function renderSaved() {
    var ul = $('saved');
    ul.innerHTML = places.length ? '' : '<li><span class="msg" style="margin:10px 0">Поки порожньо</span></li>';
    places.forEach(function (p, i) {
      var li = document.createElement('li');
      li.innerHTML = '<button class="pick"></button><button class="del" aria-label="Видалити">×</button>';
      var b = li.querySelector('.pick'); b.textContent = p.name;
      var sm = document.createElement('small'); sm.textContent = num(p.lat, 2) + ', ' + num(p.lon, 2); b.appendChild(sm);
      b.addEventListener('click', function () { setPlace(p); });
      li.querySelector('.del').addEventListener('click', function () { places.splice(i, 1); lsSet('podykh-places', places); renderSaved(); });
      ul.appendChild(li);
    });
  }
  function gps(auto) {
    var m = $('gpsMsg');
    if (!navigator.geolocation) { if (!auto) { m.hidden = false; m.textContent = 'Цей пристрій не віддає місцезнаходження.'; } return Promise.resolve(false); }
    if (!auto) { m.hidden = false; m.textContent = 'Шукаю вас…'; }
    return new Promise(function (res) {
      navigator.geolocation.getCurrentPosition(function (pos) {
        setPlace({ name: 'Моє місце', lat: +pos.coords.latitude.toFixed(4), lon: +pos.coords.longitude.toFixed(4), gps: true });
        m.hidden = true; res(true);
      }, function () {
        if (!auto) { m.hidden = false; m.textContent = 'Немає дозволу на місцезнаходження. Знайдіть місце за назвою.'; }
        res(false);
      }, { timeout: 8000, maximumAge: 600000 });
    });
  }
  var qt = null;
  function search(q) {
    var ul = $('results'), m = $('qMsg'); ul.innerHTML = ''; m.hidden = true;
    if (q.length < 2) return;
    fetchJson('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(q) + '&count=8&language=uk&format=json', 7000).then(function (j) {
      var r = j.results || [];
      if (!r.length) { m.hidden = false; m.textContent = 'Нічого не знайдено. Дрібні села в базі бувають неповні: оберіть точку через місцезнаходження.'; return; }
      r.forEach(function (x) {
        var li = document.createElement('li'), b = document.createElement('button'); b.className = 'pick';
        b.textContent = x.name; var sm = document.createElement('small'); sm.textContent = [x.admin2, x.admin1, x.country].filter(Boolean).join(', '); b.appendChild(sm);
        b.addEventListener('click', function () { setPlace({ name: x.name, lat: x.latitude, lon: x.longitude }); });
        li.appendChild(b); ul.appendChild(li);
      });
    }).catch(function () { m.hidden = false; m.textContent = 'Пошук доступний у встановленій апці з мережею.'; });
  }
  $('q').addEventListener('input', function (e) { clearTimeout(qt); var v = e.target.value.trim(); qt = setTimeout(function () { search(v); }, 350); });
  $('lkBtn').addEventListener('click', function () {
    var p = parseLink($('lk').value), m = $('lkMsg');
    if (!p) { m.hidden = false; m.textContent = 'У цьому тексті немає особистого посилання.'; return; }
    m.hidden = true; $('lk').value = ''; setPlace(p); iosManifest();
  });
  $('gpsBtn').addEventListener('click', function () { gps(false); });
  $('saveBtn').addEventListener('click', function () {
    var nm = $('saveName').value.trim(); if (!nm || !place) return;
    places.push({ name: nm, lat: place.lat, lon: place.lon }); lsSet('podykh-places', places);
    place = { name: nm, lat: place.lat, lon: place.lon }; lsSet('podykh-active', place); $('saveName').value = ''; $('placeName').textContent = nm; renderSaved();
  });
  $('placeBtn').addEventListener('click', openSheet);
  $('shClose').addEventListener('click', closeSheet);
  $('scrim').addEventListener('click', function (e) { if (e.target === $('scrim')) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  var rt = null;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(renderMap, 150); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && M && !M.demo && place) { var s = M.stamp.split(':'), now = new Date(); if (Math.abs(now.getHours() * 60 + now.getMinutes() - (+s[0] * 60 + +s[1])) > 20) load(); }
  });

  /* ---------- start ---------- */
  if (place) load();
  else {
    $('placeName').textContent = 'Оберіть місце';
    $('verdict').textContent = 'Оберіть місце або відкрийте особисте посилання.';
    renderMap(); openSheet();
  }
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
